name: TVer drama ranking
on:
  schedule:
    - cron: '0 12 * * *' # 21:00 Asia/Tokyo
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (do not post to Discord)'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: tver-discord
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fetch ranking and notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm run preview
          else
            npm start
          fi
